<!doctype html>
<!--
  ============================================================
  FICHIER : index.html
  DESCRIPTION : Page principale de l'application Smart Pangya Calculator
  AUTEUR : Onezim
  ============================================================
  Cette page constitue l'interface utilisateur principale de l'application.
  Elle est organisée en 4 onglets :
    1. Calculs     - Saisie des paramètres de tir et calcul des résultats
    2. Overlays    - Gestion des superpositions d'écran (règle, spin, vent)
    3. Statistiques - Configuration des statistiques du personnage
    4. Options avancées - Calculs de pente (Slope/Breaks)
  ============================================================
-->
<html lang="fr_FR">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Calculator by Onezim</title>

    <!-- Chargeur de thème - applique le thème sauvegardé avant le rendu -->
    <script src="shared/js/theme-loader.js"></script>

    <!-- Feuille de style principale de l'application -->
    <link rel="stylesheet" href="style/main.css" />
  </head>

  <body>
    <!-- ================================================================
         BARRE DE TITRE PERSONNALISÉE (gérée par Tauri)
         Permet de réduire, agrandir ou fermer la fenêtre de l'application.
         ================================================================ -->
    <div id="titlebar">
      <div class="titlebar-left">
        <span class="titlebar-icon">🏌️</span>
        <span class="titlebar-title">Smart Pangya Calculator</span>
      </div>
      <div class="titlebar-right">
        <button id="titlebar-minimize" class="titlebar-btn" title="Réduire">
          ─
        </button>
        <button id="titlebar-maximize" class="titlebar-btn" title="Agrandir">
          ☐
        </button>
        <button
          id="titlebar-close"
          class="titlebar-btn titlebar-close"
          title="Fermer"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- ================================================================
         PAGE PRINCIPALE
         ================================================================ -->
    <div class="page">
      <!-- ============================================================
           BOUTON PARAMÈTRES
           ============================================================ -->
      <div class="top_menu">
        <button
          id="btn-overlays-toggle"
          data-i18n-title="window_title_overlays"
        >
          🎛️
        </button>
        <button
          id="btn-settings-toggle"
          data-i18n-title="window_title_settings"
        >
          ⚙️
        </button>
      </div>
      <!-- ============================================================
           SYSTÈME D'ONGLETS (4 onglets)
           ============================================================ -->
      <div class="tabs">
        <!-- Onglet 1 : Calculs -->
        <input type="radio" name="tab" id="tab1" checked />
        <label for="tab1" class="tab-label" data-i18n="tab_cal">Calculs</label>

        <!-- Onglet 2 : Statistiques -->
        <input type="radio" name="tab" id="tab2" />
        <label for="tab2" class="tab-label" data-i18n="tab_stats"
          >Statistiques</label
        >

        <!-- Onglet 3 : Options avancées (Slope) -->
        <input type="radio" name="tab" id="tab3" />
        <label for="tab3" class="tab-label" data-i18n="tab_slope"
          >Options avancées</label
        >

        <!-- ============================================================
             CONTENU ONGLET 1 : CALCULS
             ============================================================ -->
        <div class="tab-content" id="content1">
          <!--
            SECTION : SÉLECTION DU PARCOURS
            Permet de choisir un parcours, un trou et un emplacement de pin.
            Les données sont chargées dynamiquement via CourseStore.js.
          -->
          <div class="card mb-20">
            <div class="flex items-center gap-12">
              <div class="field grow">
                <label for="select-parcours" data-i18n="label_course"
                  >Parcours :</label
                >

                <!-- Sélecteurs cascade : Map → Hole → Pin -->
                <div id="course-selector-container">
                  <div class="course-selector">
                    <select
                      id="select-parcours"
                      class="course-select"
                      data-placeholder="-- Map --"
                    >
                      <option value="">-- Map --</option>
                    </select>
                    <select
                      id="select-trou"
                      class="course-select"
                      data-placeholder="-- Hole --"
                      disabled
                    >
                      <option value="">-- Hole --</option>
                    </select>
                    <select
                      id="select-pin"
                      class="course-select"
                      data-placeholder="-- Pin --"
                      disabled
                    >
                      <option value="">-- Pin --</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!--
            SECTION : CALCULATEUR DE TIR
            Zone principale de saisie des paramètres et de calcul.
          -->
          <div class="calculator-layout">
            <!--
              CARTE GAUCHE : Paramètres du tir
              Regroupe tous les champs de saisie nécessaires au calcul.
            -->
            <div class="card grow">
              <div class="card-title" data-i18n="card_shot_config">
                Configuration Tir
              </div>

              <!-- Ligne 1 : Club + Shot + Power Shot -->
              <div class="form-grid">
                <div class="field select-club">
                  <label data-i18n="label_club">Club:</label>
                  <select id="club">
                    <option value="0">1W</option>
                    <option value="1">2W</option>
                    <option value="2">3W</option>
                    <option value="3">2I</option>
                    <option value="4">3I</option>
                    <option value="5">4I</option>
                    <option value="6">5I</option>
                    <option value="7">6I</option>
                    <option value="8">7I</option>
                    <option value="9">8I</option>
                    <option value="10">9I</option>
                    <option value="11">PW</option>
                    <option value="12">SW</option>
                  </select>
                </div>
                <div class="field">
                  <label data-i18n="label_shot">Shot:</label>
                  <select id="shot">
                    <option value="0" data-i18n="shot_dunk">Dunk</option>
                    <option value="1" data-i18n="shot_tomahawk">
                      Tomahawk
                    </option>
                    <option value="2" data-i18n="shot_spike">Spike</option>
                    <option value="3" data-i18n="shot_cobra">Cobra</option>
                  </select>
                </div>
                <div class="field">
                  <label data-i18n="label_power_shot">Power Shot:</label>
                  <select id="power_shot">
                    <option value="0" data-i18n="ps_none">No Power Shot</option>
                    <option value="1" data-i18n="ps_1">1 Power Shot</option>
                    <option value="2" data-i18n="ps_2">2 Power Shot</option>
                    <option value="3" data-i18n="ps_15y">15y Power Shot</option>
                  </select>
                </div>
              </div>

              <!-- Ligne 2 : Distance + Height -->
              <div class="form-grid">
                <div class="field">
                  <label data-i18n="label_distance">Distance:</label>
                  <input
                    id="distance"
                    autocomplete="off"
                    type="text"
                    maxlength="6"
                    value="200"
                  />
                </div>
                <div class="field">
                  <label data-i18n="label_height">Height:</label>
                  <input
                    id="height"
                    autocomplete="off"
                    type="text"
                    maxlength="6"
                    value="0"
                  />
                </div>
              </div>

              <!-- Ligne 3 : Wind + Degree -->
              <div class="form-grid">
                <div class="field">
                  <label data-i18n="label_wind">Wind:</label>
                  <input
                    id="wind"
                    autocomplete="off"
                    type="text"
                    maxlength="2"
                    value="1"
                  />
                </div>
                <div class="field">
                  <label data-i18n="label_degree">Degree:</label>
                  <input
                    id="degree"
                    autocomplete="off"
                    type="text"
                    maxlength="6"
                    value="45"
                  />
                </div>
              </div>

              <!-- Ligne 4 : Spin + bouton Spin idéal -->
              <div class="form-grid">
                <div class="field">
                  <label data-i18n="label_spin">Spin:</label>
                  <input
                    id="spin"
                    autocomplete="off"
                    type="text"
                    maxlength="5"
                    value="0"
                  />
                </div>
                <div class="field">
                  <label data-i18n="label_curve">Curve:</label>
                  <input
                    id="curve"
                    autocomplete="off"
                    type="text"
                    maxlength="4"
                    value="0"
                  />
                </div>
              </div>

              <!-- Options et filtres de spin & courbe -->
              <div class="form-grid">
                <!-- Toggle Spin Positif Uniquement -->
                <label class="toggle" for="chk-spin-positive">
                  <span
                    ><span data-i18n="spin_positive_only">Forcer</span> ▼</span
                  >
                  <input
                    type="checkbox"
                    id="chk-spin-positive"
                    class="toggle__input"
                  />
                  <span class="toggle__track"></span>
                </label>

                <!-- Toggle Forcer Spin Négatif (Flèche vers le bas) -->
                <label class="toggle" for="chk-spin-negative">
                  <span
                    ><span data-i18n="spin_negative_only">Forcer</span> ▲</span
                  >
                  <input
                    type="checkbox"
                    id="chk-spin-negative"
                    class="toggle__input"
                  />
                  <span class="toggle__track"></span>
                </label>
              </div>
              <!-- Ligne 5 : Boutons optimiseurs -->
              <div class="form-grid">
                <div class="field ideal-spin">
                  <button
                    class="action-btn action-btn--success"
                    id="btn-optimize-spin"
                    type="button"
                    data-i18n="ideal_spin"
                  >
                    Spin idéal
                  </button>
                </div>
                <div class="field ideal-spin">
                  <button
                    id="btn-click-spin"
                    class="action-btn action-btn--success"
                    type="button"
                    data-i18n="apply-spin"
                  >
                    Appliquer le spin
                  </button>
                </div>
              </div>

              <!-- Ligne 6 : Ground + Slope break -->
              <div class="form-grid">
                <div class="field">
                  <label data-i18n="label_ground">Ground:</label>
                  <input
                    id="ground"
                    autocomplete="off"
                    type="text"
                    maxlength="3"
                    value="100"
                  />
                </div>
                <div class="field">
                  <label data-i18n="label_slope_break">Slope break:</label>
                  <input
                    id="slope_break"
                    autocomplete="off"
                    type="text"
                    maxlength="6"
                    value="0"
                  />
                </div>
              </div>

              <!-- Boutons de réinitialisation -->
              <div class="reset-row">
                <button
                  id="reset-params"
                  class="action-btn action-btn--neutral"
                  data-i18n="btn_reset_params"
                >
                  Reset : Cr. / Gr. / Slop
                </button>
                <button
                  id="reset-hall"
                  class="action-btn action-btn--neutral"
                  data-i18n="btn_reset_hall"
                >
                  Reset Hall
                </button>
              </div>

              <!-- Zoom de la règle PB : PB Max (100%) / Smart PB (~80%) -->
              <label class="toggle mb-8" for="toggle-ruler-zoom">
                <span data-i18n="label_ruler_zoom">PB Max (100%)</span>
                <input
                  type="checkbox"
                  id="toggle-ruler-zoom"
                  class="toggle__input"
                />
                <span class="toggle__track"></span>
              </label>

              <!-- Bouton principal de calcul -->
              <button
                class="calc-btn"
                onclick="calc(this)"
                data-i18n="btn_calc_shot"
              >
                CALCULER LE TIR
              </button>

              <!-- Zone d'affichage du résultat -->
              <div class="text-center mt-8">
                <div id="result"></div>
              </div>
            </div>

            <!--
              CARTE DROITE : Calcul du vent
              Permet de visualiser et ajuster la direction du vent.
            -->
            <div class="flex flex-col gap-20 grow">
              <!-- Carte : Calculateur de vent -->
              <div class="card">
                <div class="card-title" data-i18n="card_wind">
                  Calcul du vent
                </div>

                <!-- Image du vent : capture zoomée sur la flèche du jeu -->
                <div class="flex justify-center">
                  <div class="wind-crop-box relative">
                    <img id="wind-image" />
                    <div class="angle-wrapper">
                      <canvas
                        id="angle-canvas"
                        width="360"
                        height="360"
                      ></canvas>
                    </div>
                    <div class="wind-crosshair"></div>
                  </div>
                </div>

                <!-- Contrôles : angle -->
                <div
                  class="flex flex-wrap gap-20 items-center justify-center mt-8"
                >
                  <div class="flex flex-col items-center gap-6">
                    <span
                      id="angle-display"
                      class="angle-value"
                      data-i18n="label_angle"
                      >Angle : 0°</span
                    >
                    <div class="flex gap-6">
                      <button id="btn-angle-minus" class="mini-btn">
                        - 0.5°
                      </button>
                      <button id="btn-angle-plus" class="mini-btn">
                        + 0.5°
                      </button>
                    </div>
                  </div>
                </div>
                <div class="adjust-panel">
                  <div class="flex gap-8 flex-wrap mt-8">
                    <button
                      id="btn-refresh-img"
                      class="action-btn action-btn--success"
                      data-i18n="btn_refresh"
                    >
                      Refresh
                    </button>
                  </div>

                  <!-- Contrôles de recadrage de l'image -->
                  <div class="adjust-grid">
                    <div class="adjust-top">
                      <button id="btn-crop-up" class="crop-btn">▲</button>
                    </div>
                    <div class="adjust-center">
                      <button id="btn-crop-left" class="crop-btn">◀</button>
                      <span class="adjust-label" data-i18n="label_adjust_image"
                        >Adjust Image</span
                      >
                      <button id="btn-crop-right" class="crop-btn">▶</button>
                    </div>
                    <div class="adjust-bottom">
                      <button id="btn-crop-down" class="crop-btn">▼</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ============================================================
             CONTENU ONGLET 2 : STATISTIQUES
             ============================================================ -->
        <div class="tab-content" id="content2">
          <!--
            SECTION : STATISTIQUES DU PERSONNAGE
            Permet de sélectionner un personnage et de configurer ses stats.
            Les données sont gérées par CharacterStore.js.
          -->
          <div class="card">
            <div class="card-title" data-i18n="card_stats">Statistiques</div>

            <!-- Sélecteur de personnage avec avatar -->
            <div class="character-selector-row">
              <div class="character-avatar" id="character-avatar">
                <img
                  id="character-image"
                  src="assets/avatars/kaz.webp"
                  alt="Kaz"
                />
                <span id="character-name-display">Kaz</span>
              </div>

              <div class="character-selector-wrapper">
                <select id="character-selector" class="character-select">
                  <option value="nuri">Nuri</option>
                  <option value="hana">Hana</option>
                  <option value="azer">Azer</option>
                  <option value="cecilia">Cecilia</option>
                  <option value="max">Max</option>
                  <option value="kooharin">KoohArin</option>
                  <option value="kaz" selected>Kaz</option>
                  <option value="lucia">Lucia</option>
                  <option value="nell">Nell</option>
                  <option value="spika">Spika</option>
                </select>
              </div>
            </div>

            <!-- Grille des statistiques du personnage -->
            <div class="form-grid">
              <div class="field">
                <label data-i18n="label_power">Power:</label>
                <input id="power" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_ring_power">Ring Power:</label>
                <input id="auxpart_pwr" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_card_power">Card Power:</label>
                <input id="card_pwr" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_mascot_power">Mascot Power:</label>
                <input id="mascot_pwr" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_card_ps_power">Card PS Power:</label>
                <input id="card_ps_pwr" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_card_spin">Max Spin:</label>
                <input id="card_max_spin" type="text" />
              </div>
              <div class="field">
                <label data-i18n="label_card_curve">Max Curve:</label>
                <input id="card_max_curve" type="text" />
              </div>
            </div>
          </div>

          <div class="spacer"></div>

          <!--
            SECTION : RÉGLAGE DU SPIN PAR DÉFAUT
            Permet de définir les valeurs de spin pour chaque type de tir.
          -->
          <div class="card">
            <div class="card-title" data-i18n="card_spin_defaut">
              Réglage du Spin par défaut
            </div>
            <div class="adjust-panel">
              <div class="field-row">
                <label data-i18n="spin_dunk">Spin Dunk</label>
                <input
                  id="spinDunk"
                  autocomplete="off"
                  maxlength="2"
                  class="w-70"
                />
              </div>
              <div class="field-row">
                <label data-i18n="spin_toma">Spin Tomahawk</label>
                <input
                  id="spinToma"
                  autocomplete="off"
                  maxlength="2"
                  class="w-70"
                />
              </div>
              <div class="field-row">
                <label data-i18n="spin_spike">Spin Spike</label>
                <input
                  id="spinSpike"
                  autocomplete="off"
                  maxlength="2"
                  class="w-70"
                />
              </div>
              <div class="field-row">
                <label data-i18n="spin_cobra">Spin Cobra</label>
                <input
                  id="spinCobra"
                  autocomplete="off"
                  maxlength="2"
                  class="w-70"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- ============================================================
             CONTENU ONGLET 3 : OPTIONS AVANCÉES (SLOPE/BREAKS)
             ============================================================ -->
        <div class="tab-content" id="content3">
          <!--
            SECTION : CALCUL DE PENTE
            Permet de calculer les breaks et les angles de pente.
            Utilise la fonction calcMycella() définie dans recalc.js.
          -->
          <div class="card">
            <div class="card-title" data-i18n="card_slope">
              Calcul Slope/Breaks
            </div>

            <div class="form-grid">
              <div class="field">
                <label data-i18n="label_myce_degree">Degree:</label>
                <input id="shot-degree" type="text" autocomplete="off" />
              </div>
              <div class="field">
                <label data-i18n="label_align_degree">Align degree:</label>
                <input id="align-degree" type="text" autocomplete="off" />
              </div>
              <div class="field">
                <label data-i18n="label_slope_break">Slope break:</label>
                <input id="slope-break" type="text" autocomplete="off" />
              </div>
            </div>

            <button
              class="calc-btn"
              onclick="calcMycella(this)"
              data-i18n="btn_calc_slope"
            >
              Calcule Slope
            </button>
          </div>
        </div>
      </div>

      <!-- ============================================================
           PIED DE PAGE
           ============================================================ -->
      <footer data-i18n="footer">Developped by Onezim</footer>
    </div>

    <!-- ================================================================
         MODAL DE CONFIRMATION
         Utilisé pour les actions destructrices (ex: vider le dossier d'images).
         ================================================================ -->
    <div id="custom-confirm-modal">
      <div class="modal-box">
        <h3 class="modal-title" data-i18n="modal_title">⚠️ Attention</h3>
        <p data-i18n="modal_body">
          Voulez-vous vraiment supprimer TOUTES les images de ce dossier ? Cette
          action est irréversible.
        </p>
        <div class="modal-actions">
          <button
            id="modal-confirm-btn"
            class="modal-btn modal-btn--danger"
            data-i18n="modal_confirm"
          >
            Oui, vider
          </button>
          <button
            id="modal-cancel-btn"
            class="modal-btn modal-btn--cancel"
            data-i18n="modal_cancel"
          >
            Annuler
          </button>
        </div>
      </div>
    </div>

    <!-- ================================================================
         CHARGEMENT DES SCRIPTS
         Ordre d'exécution important pour les dépendances
         ================================================================ -->

    <!-- 2. Gestion des thèmes -->
    <script src="shared/js/themes.js"></script>

    <!-- 3. Utilitaires de calcul (recalcul des données) -->
    <script src="utils/recalc.js"></script>
    <!--Utitaires de mise en formes -->
    <script src="utils/dunk_options_boutons.js"></script>

    <!-- 4. Calculateur principal -->
    <script src="shared/js/smart_calculator.js"></script>

    <!-- 5. Optimiseur de Dunk -->
    <script src="shared/js/dunk_optimizer.js"></script>
    <script src="shared/js/dunk_button.js"></script>
    <script src="shared/js/dunk_request_listener.js"></script>

    <!-- 6. Services (Tauri, Stockage) -->
    <script src="core/services/TauriService.js"></script>
    <script src="core/services/StorageService.js"></script>
    <script src="shared/js/i18n.js"></script>
    <!-- 7. Stores (données) -->
    <script src="core/stores/CourseStore.js"></script>
    <script src="core/stores/PlayerStore.js"></script>
    <script src="models/Character.js"></script>
    <script src="core/stores/CharacterStore.js"></script>

    <!-- 8. Composants UI -->
    <script src="core/components/CourseSelector.js"></script>
    <script src="core/services/ResolutionCalibrationService.js"></script>
    <script src="core/components/ScreenshotManager.js"></script>
    <script src="core/components/WindAngleSelector.js"></script>
    <script src="core/components/CharacterManager.js"></script>
    <!-- 9. Application principale -->
    <script src="app.js"></script>

    <!-- 10. Point d'entrée principal (initialise l'app au chargement du DOM) -->
    <script src="main.js"></script>

    <!-- 11. Initialisation manuelle -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.App) {
          window.App.init();
        }
      });
    </script>
  </body>
</html>
